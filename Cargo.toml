[package]
name = "airstream"
version = "0.1.16"
edition = "2021"
description = "Airflow-style local media caster, rewritten in Rust (clean-room, based on reverse-engineered behaviour)"
license = "MIT"
authors = ["Mark", "Nong Zero"]

[[bin]]
name = "airstream"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "time", "process", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-util = { version = "0.7", features = ["io"] }
native-tls = "0.2"
tokio-native-tls = "0.3"
mdns-sd = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
